name: Joe Seitaro White
tagline: AI Engineering & Data Journalism
bio: |
  Hi!

  I'm an AI engineer. Since 2022, I've worked with the Data & Graphics team at The Observer on several award-winning data journalism investigations.

  I'm currently based in Tokyo, where I take a lot of [photographs.](https://seitaro-white.github.io/travel-tracker-frontend/)

  I'm available for freelance work, [say hi!](mailto:seitaro.white@gmail.com).

