intro: "A few things I've previously worked on:"

# Projects appear in this order. Descriptions and responsibilities support Markdown.
projects:
  - name: 🤖 global-ai-index
    url: https://observer.co.uk/data/global-ai
    years: 2022 - ongoing
    role: Project lead
    description: An annual report benchmarking countries on their level of AI development.
    responsibilities:
      - Methodology and overall focus for the Index, and leading dissemination and stakeholder engagement with industry/policy leaders.
      - Agent search/research & human review ETL pipeline for collecting and processing 100+ data indicators from various public & private sources.
    tech: [gcp, terraform, bigquery, langgraph]

  - name: 🎈 hot-air
    url: https://observer.co.uk/hot-air-explore-tool
    years: 2024 - 2025
    role: Engineering lead
    description: An interactive database of online climate misinformation, identifying and tracking 300 individuals who regularly post climate skepticism online across social media
    responsibilities:
      - Methodology for identifying and categorising climate misinformation online, in collaboration with the University of Exeter.
      - Multi-stage ML/LLM classification and evaluation pipeline over dataset of over one million social media posts.
      - Data scraping system for ingesting content from variety of social media websites/news publications.
    tech: [postgres, pytorch, selenium, hf, BERTTopic]

  - name: ♟️ peer-review
    url: https://observer.co.uk/peer-review
    years: 2023 - 2024
    role: Engineering lead
    description: >-
      Data investigation and interactive visual tool on the  UK House of Lords winner of the Royal Society of Statistics' [2025 Data Visualisation award](https://rss.org.uk/news-publication/news-publications/2025/general-news/statistical-excellence-in-journalism-awards-2025-w/) for Statistical Excellence in Journalism.
    responsibilities:
      - Core "Archetype" conceptual model for understanding Lords from statistical patterns of behaviour built up from public records and activity.
      - RAG & LLM assesment system for identifying potential financial conflicts-of-interest; automatic search & analysis of Lord financial interests and hansard activity to flag to journalists, driving [multiple](https
         ://www.tortoisemedia.com/2024/12/11/tory-peers-unregistered-weapons-interests-prompt-account
         ability-black-hole-warning) [reporting threads](https://www.tortoisemedia.com/2024/11/22/peers-s
         peak-on-net-zero-policies-without-declaring-fossil-fuel-shareholdings)).
    tech: [scikit-learn, open-ai, pgvector]

  - name: 💰 westminster-accounts
    url: https://observer.co.uk/data/the-westminster-accounts
    years: 2022 - ongoing
    role: Engineering lead
    description: >-
      Comprehensive searchable database tracking money flowing into the UK parliament, in collaboration with Sky News. Winner of Press Gazette's Data Journalism award, Royal Television Society's Innovation award, and London Press Club's Cudlipp award.
    responsibilities:
      - ETL for 200,000 financial interest records from the UK parliament into a unified dataset.
      - Built graph database and visual tool for identifying relationships between MPs and financial interests, for the purposes of journalistic investigation.
      - Developed custom ML techniques for tracing entities and reconciling different company names.
      - Maintaining automated pipeline for updating the backend database with new financial interests on fortnightly basis.
    tech: [neo4j, spacy, docker]

  - name: 📚 town-library
    url: https://www.townlegal.com/news-and-resources/
    years: 2019 - 2022
    role: Project lead
    description: A set of legal resources on UK planning law, created for Town Legal LLP.
    responsibilities:
      - Planning Appeal Decision newsletter - built system for collecting weekly planning appeal decisions and publishing newsletter of summaries provided by Town Legal LLP
      - Planning Inspectorate and Court Case Explorers - built public dashboards tracking planning appeals and cases over time
      - Planning Appeals Map - interactive map of planning appeal decisions in UK between 2017-2024 by location.
      - "[Planning Court Case Network](https://simonicity.com/2020/10/10/planning-law-for-the-future/) - graph citation network of planning court cases"
    tech: [ms-azure, docker, azure-app-service, fast-api, wordpress]

other_work:
